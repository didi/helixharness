name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-tests:
    # The plain unittest entry remains dependency-free; coverage is CI tooling.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      HELIXHARNESS_REQUIRE_POWERSHELL_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage tooling
        run: python -m pip install "coverage>=7.10,<8"
      - name: Run plugin tests
        run: python -m coverage run --rcfile=helixharness/.coveragerc helixharness/scripts/run_tests.py
      - name: Plugin coverage gate and report
        if: always()
        run: |
          python -m coverage combine --rcfile=helixharness/.coveragerc
          python -m coverage xml --rcfile=helixharness/.coveragerc -o plugin-coverage.xml
          python -m coverage report --rcfile=helixharness/.coveragerc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: plugin-coverage.xml

  platform-tests:
    # helixharness-platform/ pytest suite and ruff lint. The platform is a
    # Linux server component: part of its suite pins POSIX-only behaviour
    # (user isolation, symlink-escape protection, process groups), so it runs
    # on ubuntu-latest. PYTHONUTF8 keeps subprocess decoding stable for
    # contributors on non-UTF-8 locales who run the suite locally.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install platform with dev extras
        run: python -m pip install -e "helixharness-platform[server,dev]"
      - name: Run platform tests
        working-directory: helixharness-platform
        run: python -m coverage run -m pytest
      - name: Platform coverage gate and report
        if: always()
        working-directory: helixharness-platform
        run: |
          python -m coverage combine
          python -m coverage xml -o platform-coverage.xml
          python -m coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: helixharness-platform/platform-coverage.xml
      - name: Ruff
        working-directory: helixharness-platform
        run: python -m ruff check web_ui eval bench evolution tests
